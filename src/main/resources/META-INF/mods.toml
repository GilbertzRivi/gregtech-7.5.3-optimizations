modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    displayURL = "${mod_url}"
    authors="${mod_author}"
    description = "Performance optimizations for GregTech Modern 7.5.3, applied via mixins without patching GT itself."
[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "[${forge_version},)"
    ordering = "NONE"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[${minecraft_version},)"
    ordering = "NONE"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "gtceu"
    mandatory = true
    versionRange = "[${gtceu_version},)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "ae2"
    mandatory = false
    versionRange = "[15.0,)"
    ordering = "AFTER"
    side = "BOTH"
